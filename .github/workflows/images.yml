# SPDX-License-Identifier: GPL-3.0-or-later
# GitHub mirror: tests on every push/PR; images patchbay-web and patchbay-asterisk to the GitHub
# container registry (ghcr.io/<owner>/patchbay-web, …/patchbay-asterisk) on main (tags: commit SHA,
# latest) and on version tags vX.Y.Z (tag name). The primary CI is .gitlab-ci.yml.
name: images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: rust:1-trixie
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            patchbay-web/target
            patchbay-notify/target
          key: cargo-${{ hashFiles('patchbay-web/Cargo.lock') }}
      - run: cd patchbay-notify && cargo test
      - run: cd patchbay-web && cargo test --locked

  image:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: patchbay-web
            context: .
            dockerfile: patchbay-web/Dockerfile
          - name: patchbay-asterisk
            context: asterisk
            dockerfile: asterisk/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe
      - name: Version
        id: version
        run: echo "describe=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: PBX_VERSION=${{ steps.version.outputs.describe }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
