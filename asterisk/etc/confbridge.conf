; ConfBridge: the self-service conference apps set their options per call via CONFBRIDGE().
[general]

[default_bridge]
type = bridge
max_members = 50

[default_user]
type = user
music_on_hold_when_empty = yes
announce_user_count = yes

; Menus are chosen per call by the dialplan (sub-app, exten conference). Admin actions only work
; for moderators.
[pbx_menu]
type = menu
*1 = toggle_mute
*2 = admin_toggle_conference_lock
*3 = admin_kick_last
*4 = admin_toggle_mute_participants

; the same plus *0: leaves the room briefly to ask the moderator PIN. Only for participants of a
; room with a moderator PIN, at most 3 wrong PINs per call.
[pbx_menu_pin]
type = menu
*1 = toggle_mute
*2 = admin_toggle_conference_lock
*3 = admin_kick_last
*4 = admin_toggle_mute_participants
*0 = leave_conference
