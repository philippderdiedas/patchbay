; SPDX-License-Identifier: GPL-3.0-or-later
; PBX dialplan. Data comes from PostgreSQL via func_odbc (func_odbc.conf).
; Persons, direct device dialing, outbound via route table, inbound SIP trunks via DID targets.

[general]
static = yes
writeprotect = yes
clearglobalvars = yes

[globals]
; site values rendered by asterisk/bin/site-config.sh from the environment:
; PBX_COUNTRY_CODE (own country calling code, e.g. 49; national numbers are written with trunk
; prefix 0, international ones with 00), PBX_EMERGENCY_NUMBERS (e.g. 110-112),
; PBX_EMERGENCY_TRUNK (emergency fallback when the database is unreachable)
#tryinclude /etc/asterisk-site/globals.conf

; --- Calls from own devices -----------------------------------------------------
; Replayed by patchbay-web routetest.rs (route tester): keep both in sync.

[from-device]
include => feature-codes

; Internal numbers (4 digits, number registry): persons, devices, groups, IVRs, apps
; A blind transfer (BLINDTRANSFER = transferring channel) remembers its direct target, for the
; transfer recall in sub-user/sub-group (only that number, not where an IVR or forward leads).
exten => _[1-9]XXX,1,GotoIf($["${BLINDTRANSFER}" = "" | "${BLINDTRANSFER}" = "${XF_BY}"]?go)
 same => n,Set(XF_BY=${BLINDTRANSFER})
 same => n,Set(XF_TO=${EXTEN})
 same => n,Set(XF_RECALLED=)
 same => n(go),Gosub(sub-internal,s,1(${EXTEN},person-group-ivr-app-device))
 same => n,Hangup()

; Other sites (their prefix + 4-digit number, never starting with 0): the dial rules decide
exten => _[1-9]XXXX.,1,Gosub(sub-outbound,s,1(${EXTEN}))
 same => n,Hangup()

; Short numbers (2–3 digits: emergency numbers from PBX_EMERGENCY_NUMBERS, service numbers) and
; the EU-wide 116xxx: the dial rules decide (no rule: "invalid"; emergency fallback: sub-outbound)
exten => _[1-9]X,1,Gosub(sub-outbound,s,1(${EXTEN}))
 same => n,Hangup()
exten => _[1-9]XX,1,Gosub(sub-outbound,s,1(${EXTEN}))
 same => n,Hangup()
exten => _116XXX,1,Gosub(sub-outbound,s,1(${EXTEN}))
 same => n,Hangup()

; Outbound: anything starting with 0 or +
exten => _0.,1,Gosub(sub-outbound,s,1(${EXTEN}))
 same => n,Hangup()
exten => _+.,1,Gosub(sub-outbound,s,1(${EXTEN}))
 same => n,Hangup()

exten => i,1,Playback(invalid)
 same => n,Hangup()

; Listed for users by patchbay-web help.rs FEATURE_CODES (help page, "Services" phone book): keep both in sync.
[feature-codes]
exten => *43,1,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; Pickup: *8 = any ringing call in the own pickup group, *8<ext> = a colleague's ringing devices,
; only when the colleague's call group is one of the caller's pickup groups (same as *8)
exten => *8,1,Pickup()
 same => n,Hangup()
exten => _*8[1-9]XXX,1,GotoIf($["${CHANNEL(channeltype)}" != "PJSIP"]?fc-error,1)
 same => n,Set(PD=${ODBC_PICKUP_DIAL(${CHANNEL(endpoint)},${EXTEN:2})})
 same => n,GotoIf($["${PD}" = ""]?fc-error,1)
 same => n,PickupChan(${PD},p)
 same => n,Hangup()

; DND and immediate forward. The caller is identified by its device; patchbay-web stores the
; setting (forward targets are checked against the user's own dial rights).
; Prompts: the German sound pack has none for this, so they are played in English.
; DND: *761 = on, *760 = off (explicit, no toggle)
exten => _*76[01],1,Gosub(fc-caller,1)
 same => n,Set(FC=${CURL(http://pbx:${PBX_INTERNAL_KEY}@127.0.0.1:8081/internal/dnd,ext=${FC_EXT}&on=${EXTEN:3:1})})
 same => n,GotoIf($["${FC}" != "on" & "${FC}" != "off"]?fc-error,1)
 same => n,Set(CHANNEL(language)=en)
 same => n,Playback(do-not-disturb&${IF($["${FC}" = "on"]?activated:de-activated)})
 same => n,Hangup()
exten => _*21*X.,1,Gosub(fc-caller,1)
 same => n,Set(FC=${CURL(http://pbx:${PBX_INTERNAL_KEY}@127.0.0.1:8081/internal/forward,ext=${FC_EXT}&target=${URIENCODE(${FILTER(0123456789+,${EXTEN:4})})})})
 same => n,GotoIf($["${FC}" != "set"]?fc-error,1)
 same => n,Set(CHANNEL(language)=en)
 same => n,Playback(call-fwd-unconditional&activated)
 same => n,Hangup()
exten => #21#,1,Gosub(fc-caller,1)
 same => n,Set(FC=${CURL(http://pbx:${PBX_INTERNAL_KEY}@127.0.0.1:8081/internal/forward,ext=${FC_EXT}&target=)})
 same => n,GotoIf($["${FC}" != "cleared"]?fc-error,1)
 same => n,Set(CHANNEL(language)=en)
 same => n,Playback(call-fwd-unconditional&de-activated)
 same => n,Hangup()

; *97: listen to the own and call group voicemail (no PIN, the caller is identified by its
; device). List and state changes go through patchbay-web (access, audit, MWI); menu in [vm-listen].
exten => *97,1,Gosub(fc-caller,1)
 same => n,Set(VL=${CURL(http://pbx:${PBX_INTERNAL_KEY}@127.0.0.1:8081/internal/voicemail/list,ext=${FC_EXT})})
 same => n,GotoIf($["${CUT(VL,\,,1)}" != "ok"]?fc-error,1)
 same => n,Goto(vm-listen,s,1)

; extension of the calling device's user (FC_EXT), hangs up for anything that is not a device
exten => fc-caller,1,Answer()
 same => n,Wait(0.3)
 same => n,GotoIf($["${CHANNEL(channeltype)}" != "PJSIP"]?fc-error,1)
 same => n,Set(CI=${ODBC_CALLER_INFO(${CHANNEL(endpoint)})})
 same => n,GotoIf($["${CI}" = ""]?fc-error,1)
 same => n,Set(FC_EXT=${CUT(CI,\,,1)})
 same => n,Return()
exten => fc-error,1,Answer()
 same => n,Playback(beeperr)
 same => n,Hangup()

; --- Call a person -------------------------------------------------------------
; ARG1 = extension
; Mirrored in patchbay-web flow.rs (call flow diagram): keep both in sync.

[sub-user]
exten => s,1,Set(INFO=${ODBC_USER_INFO(${ARG1})})
 same => n,Set(U_DV=)
 same => n,GotoIf($["${INFO}" = ""]?invalid)
 same => n,Set(ARRAY(U_ACTIVE,U_DND,U_TIMEOUT,U_LANG,U_NOANSWER,U_FWD)=${INFO})
 same => n,GotoIf($["${U_ACTIVE}" != "1"]?invalid)
 ; personal blocklist (start page, call widget; user_caller_blocked()): busy for
 ; calls to this person, before their forward and no-answer target; call groups and queues ring
 ; members via group-member and are not affected. Before PbxTarget: no "missed call" for it.
 same => n,GotoIf($["${ODBC_USER_CALLER_BLOCKED(${ARG1},${CALLERID(num)})}" = "1"]?blocked)
 ; call tracking in patchbay-web (AMI): the call reached this person
 same => n,UserEvent(PbxTarget,Kind: user,Number: ${ARG1},Did: ${PBX_DID},Fwd: ${U_FWD},Dnd: ${U_DND})
 same => n,GotoIf($["${U_FWD}" != "0"]?forward)
 same => n,GotoIf($["${U_DND}" = "1"]?noanswer)
 same => n,Set(U_DIAL=${ODBC_USER_DIAL(${ARG1})})
 same => n,GotoIf($["${U_DIAL}" = ""]?noanswer)
 ; caller name from the called person's own contacts, for this Dial only (restored afterwards,
 ; so forwards and the no-answer target do not show it to others)
 same => n,Set(U_CN=${CALLERID(name)})
 same => n,Set(U_KN=${ODBC_CONTACT_NAME(${ARG1},${CALLERID(num)})})
 same => n,GotoIf($[${LEN(${U_KN})} = 0]?dial)
 same => n,Set(CALLERID(name)=${U_KN})
 ; transferred call: ring at most transfer_recall_s here, then back to the transferring person
 same => n(dial),Gosub(sub-recall-time,s,1(${ARG1},${U_TIMEOUT}))
 ; c: other devices show "answered elsewhere" instead of "missed"
 same => n,Dial(${U_DIAL},${XR_T},cb(pbx-xheaders^s^1))
 ; "reject" in the web UI (companion.rs): patchbay-web sets pbx_divert/<linkedid>-<ext> = busy, then hangs
 ; up the ringing legs; read and delete it in any case so no stale key is left
 same => n,Set(U_DV=${DB_DELETE(pbx_divert/${CHANNEL(linkedid)}-${ARG1})})
 same => n,Set(CALLERID(name)=${U_CN})
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 ; call tracking: nobody answered (or DND) – distinguishes "no answer" from "caller hung up"
 same => n(noanswer),UserEvent(PbxNoAnswer,Number: ${ARG1})
 same => n,Gosub(sub-recall,s,1(${ARG1}))
 same => n,GotoIf($["${XR}" = "1"]?done)
 ; rejected in the web UI: the caller hears busy instead of the no-answer rule (a transferred call
 ; first went back to the transferring person above)
 same => n,GotoIf($["${U_DV}" = "busy"]?rejected)
 same => n,GotoIf($["${U_NOANSWER}" = "0"]?unavailable)
 same => n,Gosub(sub-target,s,1(${U_NOANSWER}))
 same => n,Goto(done)
 ; forward chains/loops (A -> B -> A): at most 3 hops
 same => n(forward),Set(PBX_FWD_HOPS=$[0${PBX_FWD_HOPS} + 1])
 same => n,GotoIf($[${PBX_FWD_HOPS} > 3]?unavailable)
 same => n,Gosub(sub-target,s,1(${U_FWD}))
 same => n,Goto(done)
 same => n(unavailable),Answer()
 same => n,Playback(vm-nobodyavail)
 same => n,Goto(done)
 same => n(blocked),NoOp(Blocked by ${ARG1}: ${CALLERID(num)})
 same => n(rejected),Busy(5)
 same => n,Goto(done)
 same => n(invalid),Answer()
 same => n,Playback(invalid)
 same => n(done),Return()

; --- Execute target --------------------------------------------------------------
; ARG1 = targets.id
; Mirrored in patchbay-web flow.rs (call flow diagram): keep both in sync.

[sub-target]
exten => s,1,Set(T=${ODBC_TARGET(${ARG1})})
 same => n,GotoIf($["${T}" = ""]?notavail)
 same => n,Set(ARRAY(T_KIND,T_USER,T_GROUP,T_IVR,T_SOUND,T_EXT,T_OWNER,T_APP)=${T})
 same => n,GotoIf($["${T_KIND}" = "user"]?user)
 same => n,GotoIf($["${T_KIND}" = "announcement"]?announce)
 same => n,GotoIf($["${T_KIND}" = "external"]?external)
 same => n,GotoIf($["${T_KIND}" = "hangup"]?done)
 same => n,GotoIf($["${T_KIND}" = "group"]?group)
 same => n,GotoIf($["${T_KIND}" = "ivr"]?ivr)
 same => n,GotoIf($["${T_KIND}" = "mailbox_user"]?mbuser)
 same => n,GotoIf($["${T_KIND}" = "mailbox_group"]?mbgroup)
 same => n,GotoIf($["${T_KIND}" = "app" & "${T_APP}" != ""]?app)
 ; target missing or unknown kind
 same => n(notavail),Answer()
 same => n,Playback(ss-noservice)
 same => n,Goto(done)
 same => n(mbuser),Gosub(sub-mailbox,s,1(user,${T_USER}))
 same => n,Goto(done)
 same => n(mbgroup),Gosub(sub-mailbox,s,1(group,${T_GROUP}))
 same => n,Goto(done)
 same => n(ivr),Gosub(sub-ivr,s,1(${T_IVR}))
 same => n,Goto(done)
 same => n(app),Gosub(sub-app,s,1(${T_APP}))
 same => n,Goto(done)
 same => n(group),Gosub(sub-group,s,1(${T_GROUP}))
 same => n,Goto(done)
 same => n(user),Gosub(sub-user,s,1(${T_USER}))
 same => n,Goto(done)
 same => n(announce),Answer()
 same => n,Playback(pbx/${T_SOUND})
 same => n,Goto(done)
 ; external target set by a person in self-service (T_OWNER = their extension): dialled with the
 ; owner's permission classes, checked now, not only when it was saved
 same => n(external),GotoIf($["${T_OWNER}" != ""]?owned)
 ; admin-configured external target: allowed once, for exactly this number (see sub-outbound)
 same => n,Set(PBX_ALLOW_EXTERNAL=${T_EXT})
 same => n,Gosub(sub-outbound,s,1(${T_EXT}))
 same => n,Goto(done)
 same => n(owned),Set(PBX_FWD_OWNER=${T_OWNER})
 same => n,Gosub(sub-outbound,s,1(${T_EXT}))
 same => n(done),Return()

; --- Self-service apps (conference, music, announcement, echo, alias) ---------------------
; ARG1 = app number

[sub-app]
exten => s,1,Set(AI=${ODBC_APP(${ARG1})})
 same => n,GotoIf($["${AI}" = ""]?invalid)
 same => n,Set(ARRAY(A_ID,A_KIND,A_PIN,A_ADMIN_PIN,A_MAX,A_MOH,A_FILE,A_REPEAT,A_TARGET)=${AI})
 same => n,Goto(${A_KIND},1)
 same => n(invalid),Answer()
 same => n,Playback(invalid)
 same => n,Return()

exten => conference,1,Answer()
 same => n,Wait(0.5)
 same => n,Set(A_ADMIN=no)
 ; wrong moderator PINs via *0 in this call: after 3, *0 is no longer offered
 same => n,Set(A_MTRY=0)
 ; room PIN (only when set): asked before joining; the moderator PIN works there too. Without a
 ; room PIN nobody is asked anything: moderators press *0 in the room (below). Three attempts.
 ; Wrong PINs are logged and counted (sub-pinfail), but a room is never locked: that would let
 ; anybody lock colleagues out of a running meeting.
 same => n,GotoIf($["${A_PIN}" = ""]?join)
 same => n,Set(A_TRY=0)
 same => n(pin),Set(A_TRY=$[${A_TRY} + 1])
 same => n,Read(A_IN,conf-getpin,10,,1,8)
 same => n,GotoIf($["${A_ADMIN_PIN}" != "" & "${A_IN}" = "${A_ADMIN_PIN}"]?admin)
 same => n,GotoIf($["${A_IN}" = "${A_PIN}"]?join)
 same => n,GotoIf($["${A_IN}" = ""]?badpin)
 same => n,Gosub(sub-pinfail,s,1(${A_ID},${ARG1},conference,))
 same => n(badpin),Playback(conf-invalidpin)
 same => n,GotoIf($[${A_TRY} < 3]?pin)
 same => n,Hangup()
 same => n(admin),Set(A_ADMIN=yes)
 same => n(join),Set(CONFBRIDGE(bridge,max_members)=${A_MAX})
 same => n,Set(CONFBRIDGE(user,admin)=${A_ADMIN})
 same => n,Set(CONFBRIDGE(user,music_on_hold_when_empty)=yes)
 same => n,Set(CONFBRIDGE(user,music_on_hold_class)=${A_MOH})
 same => n,Set(CONFBRIDGE(user,announce_user_count)=yes)
 ; video: everybody sees the current speaker (phones without video simply get audio)
 same => n,Set(CONFBRIDGE(bridge,video_mode)=follow_talker)
 ; *0 (menu pbx_menu_pin, confbridge.conf) only where it can do something: the room has a moderator
 ; PIN, the caller is no moderator yet and has had fewer than 3 wrong moderator PINs in this call
 same => n,Set(A_MENU=${IF($["${A_ADMIN_PIN}" != "" & "${A_ADMIN}" != "yes" & ${A_MTRY} < 3]?pbx_menu_pin:pbx_menu)})
 same => n,ConfBridge(app${A_ID},,,${A_MENU})
 ; *0 in the room (menu action leave_conference, result DTMF): ask the moderator PIN, then back
 ; into the same room – as moderator if it was right, otherwise in the caller's previous role
 same => n,GotoIf($["${CONFBRIDGE_RESULT}" != "DTMF"]?done)
 same => n,Read(A_IN,agent-pass,10,,1,8)
 same => n,GotoIf($["${A_ADMIN_PIN}" != "" & "${A_IN}" = "${A_ADMIN_PIN}"]?admin)
 same => n,GotoIf($["${A_IN}" = ""]?rejoin)
 same => n,Set(A_MTRY=$[${A_MTRY} + 1])
 same => n,Gosub(sub-pinfail,s,1(${A_ID},${ARG1},moderator,))
 same => n,Playback(auth-incorrect)
 ; back in as a participant. The caller left the room for the PIN: a room locked meanwhile (*2) or
 ; full does not take them back (moderators always get in). Say so and end instead of dropping the
 ; call silently (ConfBridge would refuse with the same prompt and hang up).
 same => n(rejoin),GotoIf($[0${CONFBRIDGE_INFO(locked,app${A_ID})} != 1 & 0${CONFBRIDGE_INFO(parties,app${A_ID})} < ${A_MAX}]?join)
 same => n,Playback(conf-locked&vm-goodbye)
 same => n(done),Return()

exten => music,1,Answer()
 same => n,MusicOnHold(${A_MOH})
 same => n,Return()

exten => announcement,1,Answer()
 same => n,Wait(0.5)
 same => n,GotoIf($["${A_FILE}" = ""]?done)
 same => n,Set(A_I=0)
 same => n(play),Playback(${A_FILE})
 same => n,Set(A_I=$[${A_I} + 1])
 same => n,GotoIf($[${A_I} < ${A_REPEAT}]?play)
 same => n(done),Return()

exten => echo,1,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Return()
; call group made by a user (apps.rs, members in app_members): all ring at the same time via
; group-member (no forwards), optional caller name prefix; nobody answers -> "nobody available"
exten => group,1,Set(AG=${ODBC_APP_GROUP(${A_ID})})
 same => n,Set(ARRAY(AG_T,AG_PFX,AG_M)=${AG})
 same => n,GotoIf($["${AG_M}" = ""]?none)
 same => n,Set(_PBX_CNPFX=${AG_PFX})
 same => n,Set(AG_D=)
 same => n,Set(AG_I=1)
 same => n(next),Set(AG_D=${AG_D}${IF($["${AG_D}" != ""]?&)}Local/${CUT(AG_M,-,${AG_I})}@group-member)
 same => n,Set(AG_I=$[${AG_I} + 1])
 same => n,GotoIf($[${AG_I} <= ${FIELDQTY(AG_M,-)}]?next)
 same => n,Dial(${AG_D},${AG_T},c)
 same => n,Set(_PBX_CNPFX=)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n(none),Answer()
 same => n,Playback(vm-nobodyavail)
 same => n(done),Return()

; script app (apps.rs, script.rs, tts.rs): patchbay-web runs the script and speaks its text; answer
; "ok,<file>,<file>…" (absolute paths without extension under /media/tts) or "err"
exten => script,1,Answer()
 same => n,Wait(0.3)
 same => n,Set(CURLOPT(httptimeout)=30)
 same => n,Set(SR=${CURL(http://pbx:${PBX_INTERNAL_KEY}@127.0.0.1:8081/internal/app/script,id=${A_ID}&caller=${URIENCODE(${CALLERID(num)})}&lang=${CHANNEL(language)})})
 same => n,GotoIf($["${CUT(SR,\,,1)}" != "ok"]?err)
 same => n,Set(SR_N=${FIELDQTY(SR,\,)})
 same => n,Set(SR_I=2)
 same => n(play),GotoIf($[${SR_I} > ${SR_N}]?done)
 same => n,Playback(${CUT(SR,\,,${SR_I})})
 same => n,Set(SR_I=$[${SR_I} + 1])
 same => n,Goto(play)
 same => n(err),Playback(beeperr&ss-noservice)
 same => n(done),Return()

; speaking clock, like the old telephone time service: every 10 s "at the tone it is …", then the
; tone exactly on the 10-second mark. German prompts: pbx-tts/clock-* (Piper, asterisk/tts), English:
; core prompts. Time zone of the site (settings.timezone, PBX_TIMEZONE). Ends after 10 minutes.
exten => clock,1,Answer()
 same => n,Wait(0.5)
 same => n,Set(A_TZ=${ODBC_SETTING(timezone)})
 same => n,Set(A_END=$[${EPOCH} + 600])
 same => n(loop),GotoIf($[${EPOCH} > ${A_END}]?done)
 ; next 10-second mark that leaves time for the announcement (about 5 s)
 same => n,Set(A_T=$[${EPOCH} - ${EPOCH} % 10 + 10])
 same => n,ExecIf($[${A_T} - ${EPOCH} < 7]?Set(A_T=$[${A_T} + 10]))
 same => n,Set(A_H=$[${STRFTIME(${A_T},${A_TZ},%H)} + 0])
 same => n,Set(A_M=$[${STRFTIME(${A_T},${A_TZ},%M)} + 0])
 same => n,Set(A_S=$[${STRFTIME(${A_T},${A_TZ},%S)} + 0])
 same => n,GotoIf($["${CHANNEL(language)}" = "de"]?de)
 same => n,Playback(at-tone-time-exactly)
 same => n,SayNumber(${A_H})
 same => n,Playback(hours)
 same => n,SayNumber(${A_M})
 same => n,Playback(minutes&vm-and)
 same => n,SayNumber(${A_S})
 same => n,Playback(seconds)
 same => n,Goto(tone)
 same => n(de),Playback(pbx-tts/clock-intro&pbx-tts/clock-h-${A_H}&pbx-tts/clock-m-${A_M}&pbx-tts/clock-s-${A_S})
 same => n(tone),Set(A_W=$[${A_T} - ${STRFTIME(,,%s.%3q)}])
 same => n,ExecIf($[${A_W} > 0]?Wait(${A_W}))
 same => n,Playback(beep)
 same => n,Goto(loop)
 same => n(done),Return()

; alias: internal numbers only (validated by patchbay-web). At most 3 hops (alias chains/loops), and calls
; that came in via a trunk rule keep the rule's allowed kinds (PBX_KINDS, set in sub-internal).
exten => alias,1,Set(PBX_ALIAS_HOPS=$[0${PBX_ALIAS_HOPS} + 1])
 same => n,GotoIf($[${PBX_ALIAS_HOPS} > 3]?app-invalid,1)
 ; only 4-digit internal numbers (never outbound, short or emergency numbers)
 same => n,GotoIf($["${A_TARGET:0:1}" = "0" | ${LEN(${A_TARGET})} != 4]?app-invalid,1)
 same => n,GotoIf($["${PBX_KINDS}" != ""]?restricted)
 same => n,Goto(from-device,${A_TARGET},1)
 same => n(restricted),Gosub(sub-internal,s,1(${A_TARGET},${PBX_KINDS}))
 same => n,Return()
; dial-through (organization app): PIN (3 attempts), then a number; dialed as prefix + number via
; sub-outbound with a one-shot permission for exactly that number (like an admin-set forward target),
; so caller ID, channel limits and IAX loop protection stay those of a normal call.
; Wrong PINs are counted per app across calls (sub-pinfail): the 5th within 15 minutes locks the app
; for 15 minutes, and while locked every PIN counts as wrong – the caller hears the same "incorrect"
; and "goodbye", no hint.
exten => gateway,1,Answer()
 same => n,Wait(0.5)
 same => n,GotoIf($["${A_PIN}" = "" | "${A_TARGET}" = ""]?app-invalid,1)
 same => n,Set(A_TRY=0)
 same => n(pin),Set(A_TRY=$[${A_TRY} + 1])
 same => n,Read(A_IN,agent-pass,8,,1,10)
 same => n,GotoIf($["${A_IN}" = ""]?wrong)
 same => n,Gosub(sub-pinfail,locked,1(${A_ID}))
 same => n,GotoIf($["${PIN_LOCKED}" != "1" & "${A_IN}" = "${A_PIN}"]?num)
 same => n,Gosub(sub-pinfail,s,1(${A_ID},${ARG1},gateway,lock))
 same => n(wrong),Playback(auth-incorrect)
 same => n,GotoIf($[${A_TRY} < 3]?pin)
 same => n,Playback(vm-goodbye)
 same => n,Return()
 same => n(num),Read(A_NUM,vm-enter-num-to-call,16,,1,15)
 same => n,Set(A_NUM=${FILTER(0123456789,${A_NUM})})
 same => n,GotoIf($["${A_NUM}" = ""]?app-invalid,1)
 same => n,Set(PBX_ALLOW_EXTERNAL=${A_TARGET}${A_NUM})
 same => n,Gosub(sub-outbound,s,1(${A_TARGET}${A_NUM}))
 same => n,Return()
exten => app-invalid,1,Answer()
 same => n,Playback(invalid)
 same => n,Return()

; --- Wrong app PINs (dial-through, conference) ------------------------------------------------
; s: ARG1 = apps.id, ARG2 = app number, ARG3 = which PIN (gateway|conference|moderator),
;    ARG4 = "lock": lock the app after too many failures (dial-through only).
; Counted per app across calls in the Asterisk database, pbx_pinfail/<id> = <window start>:<count>
; (window 15 minutes). With ARG4 = lock the 5th failure in a window locks the app for 15 minutes:
; pbx_pinlock/<id> = <unix time until> (asterisk -rx "database deltree pbx_pinlock" unlocks).
; Every failure is logged (Asterisk log, WARNING) and reported to patchbay-web (audit log app.pin_failed,
; /monitor service "PBX App PINs"); counting and lock work without patchbay-web. Sets PIN_LOCKED.
; locked: ARG1 = apps.id; sets PIN_LOCKED = 1 while the app is locked, else 0.
[sub-pinfail]
exten => s,1,Gosub(locked,1(${ARG1}))
 same => n,Set(PF_N=)
 same => n,GotoIf($["${PIN_LOCKED}" = "1"]?report)
 same => n,Set(PF=${DB(pbx_pinfail/${ARG1})})
 same => n,Set(PF_START=${CUT(PF,:,1)})
 same => n,Set(PF_N=${CUT(PF,:,2)})
 ; no window yet, or the window is over: a new one starts with this failure
 same => n,GotoIf($[${EPOCH} - 0${PF_START} > 900]?reset)
 same => n,Set(PF_N=$[0${PF_N} + 1])
 same => n,Goto(store)
 same => n(reset),Set(PF_START=${EPOCH})
 same => n,Set(PF_N=1)
 same => n(store),Set(DB(pbx_pinfail/${ARG1})=${PF_START}:${PF_N})
 same => n,GotoIf($["${ARG4}" != "lock" | ${PF_N} < 5]?report)
 same => n,Set(DB(pbx_pinlock/${ARG1})=$[${EPOCH} + 900])
 same => n,Set(PF=${DB_DELETE(pbx_pinfail/${ARG1})})
 same => n,Set(PIN_LOCKED=1)
 same => n(report),Log(WARNING,PBX app ${ARG2} (${ARG3}): wrong PIN from ${CALLERID(num)}; ${IF($["${PIN_LOCKED}" = "1"]?PIN locked for 15 minutes:failure ${PF_N} within 15 minutes)})
 ; audit log and /monitor in patchbay-web (the answer does not matter)
 same => n,Set(CURLOPT(httptimeout)=5)
 same => n,Set(PF=${CURL(http://pbx:${PBX_INTERNAL_KEY}@127.0.0.1:8081/internal/app/pinfail,id=${ARG1}&what=${ARG3}&caller=${URIENCODE(${CALLERID(num)})}&count=${PF_N}&locked=${PIN_LOCKED})})
 same => n,Return()
exten => locked,1,Set(PIN_LOCKED=${IF($[0${DB(pbx_pinlock/${ARG1})} > ${EPOCH}]?1:0)})
 same => n,Return()

; --- Voicemail ----------------------------------------------------------------------------
; ARG1 = user|group, ARG2 = extension or call group number.
; Record() keeps the file when the caller hangs up (k); the hangup handler reports the message
; to patchbay-web, which converts it, stores it and sends the notification mail.

[sub-mailbox]
exten => s,1,Answer()
 same => n,Wait(0.5)
 same => n,Set(VM_ID=vm${EPOCH}${RAND(100000,999999)})
 same => n,UserEvent(PbxVoicemail,Owner: ${ARG1},Number: ${ARG2},VmId: ${VM_ID})
 same => n,Set(CHANNEL(hangup_handler_push)=sub-mailbox-done,s,1(${ARG1},${ARG2},${VM_ID}))
 ; prompts in the language of the mailbox owner (person or group setting), not the caller's
 same => n,Set(VM_LANG=${ODBC_MAILBOX_LANG(${ARG1},${ARG2})})
 same => n,ExecIf($["${VM_LANG}" != ""]?Set(CHANNEL(language)=${VM_LANG}))
 ; own greeting (web UI) or the standard prompt
 same => n,Set(GR=${ODBC_GREETING(${ARG1},${ARG2})})
 same => n,ExecIf($["${GR}" = ""]?Playback(vm-intro):Playback(pbx/${GR}))
 same => n,Record(/var/spool/pbx/vm/${VM_ID}.wav,3,180,k)
 same => n,Playback(vm-goodbye)
 same => n,Hangup()

[sub-mailbox-done]
exten => s,1,GotoIf($[${STAT(e,/var/spool/pbx/vm/${ARG3}.wav)} = 0]?done)
 same => n,ExecIf($["${CURL(http://pbx:${PBX_INTERNAL_KEY}@127.0.0.1:8081/internal/voicemail,id=${ARG3}&owner_type=${ARG1}&owner=${ARG2}&caller=${URIENCODE(${CALLERID(num)})}&name=${URIENCODE(${CALLERID(name)})}&did=${URIENCODE(${PBX_DID})}&call=${URIENCODE(${CHANNEL(linkedid)})})}" != "ok"]?Set(FILE(/var/spool/pbx/vm/${ARG3}.meta)=id=${ARG3}&owner_type=${ARG1}&owner=${ARG2}&caller=${URIENCODE(${CALLERID(num)})}&name=${URIENCODE(${CALLERID(name)})}&did=${URIENCODE(${PBX_DID})}&call=${URIENCODE(${CHANNEL(linkedid)})}))
 same => n(done),Return()

; --- Listening to voicemail by phone (*97) -------------------------------------------------
; Reached from *97 with FC_EXT (caller's extension) and VL from patchbay-web:
;   ok,<new>,<old>,<time zone>,<id>:<1 new|0 heard>:<unix time>:<caller digits>:<file>,...
; new messages first (oldest first), then heard ones (newest first). Prompts in the user's language
; (all used prompts exist in the English and the German pack). Keys as in app_voicemail, plus
; aliases: 5 or 1 repeat, 6 or 2 next, 4 previous, 7 delete, 9 save (= mark as heard),
; * or 0 help, # end. Playing a message to the end marks it as heard; without a key the next
; message follows after 5 s, after the last one the call ends.

[vm-listen]
exten => s,1,Set(VM_LANG=${ODBC_MAILBOX_LANG(user,${FC_EXT})})
 same => n,ExecIf($["${VM_LANG}" != ""]?Set(CHANNEL(language)=${VM_LANG}))
 same => n,Set(VN=${CUT(VL,\,,2)})
 same => n,Set(VO=${CUT(VL,\,,3)})
 same => n,Set(VTZ=${CUT(VL,\,,4)})
 same => n,Set(VQ=$[${FIELDQTY(VL,\,)} - 4])
 ; date and time: "today at 2 30 PM" / "heute um 14 Uhr 30"
 same => n,Set(VDF=Q 'digits/at' IMp)
 same => n,ExecIf($["${CHANNEL(language)}" = "de"]?Set(VDF=Q 'digits/at' HM))
 ; "You have 2 new messages and 3 old messages" / "You have no messages"
 same => n,Playback(vm-youhave)
 same => n,GotoIf($[${VN} + ${VO} = 0]?none)
 same => n,GotoIf($[${VN} = 0]?old)
 same => n,Gosub(vm-count,1(${VN}))
 same => n,Playback(vm-INBOX&vm-${IF($[${VN} = 1]?message:messages)})
 same => n,GotoIf($[${VO} = 0]?start)
 same => n,Playback(vm-and)
 same => n(old),Gosub(vm-count,1(${VO}))
 same => n,Playback(vm-Old&vm-${IF($[${VO} = 1]?message:messages)})
 same => n(start),Set(VI=1)
 same => n,Set(VDIR=1)
 same => n,GotoIf($[${VQ} > 0]?play:bye)
 ; one message: "Message 3, received today at ..., from phone number ..." then the recording
 same => n(play),Set(E=${CUT(VL,\,,$[${VI} + 4])})
 same => n,Set(V_ID=${CUT(E,:,1)})
 same => n,Set(V_NEW=${CUT(E,:,2)})
 same => n,Set(V_TS=${CUT(E,:,3)})
 same => n,Set(V_CALLER=${CUT(E,:,4)})
 same => n,Set(V_FILE=${CUT(E,:,5)})
 ; deleted in this call: skip in the current direction
 same => n,GotoIf($["${VDEL_${V_ID}}" = "1"]?skip)
 same => n,Playback(vm-message)
 same => n,SayNumber(${VI})
 same => n,Playback(vm-received)
 same => n,SayUnixTime(${V_TS},${VTZ},${VDF})
 same => n,GotoIf($["${V_CALLER}" = ""]?unknown)
 same => n,Playback(vm-from-phonenumber)
 same => n,SayDigits(${V_CALLER})
 same => n,Goto(audio)
 same => n(unknown),Playback(vm-unknown-caller)
 ; ff/rew/pause/restart mapped to the unused DTMF A-D, every menu key stops the playback
 same => n(audio),ControlPlayback(/media/voicemail/${V_FILE},0,A,B,0124567*#9,C,D)
 same => n,Set(VK=)
 same => n,GotoIf($["${CPLAYBACKSTATUS}" = "USERSTOPPED"]?stopped)
 same => n,GotoIf($["${CPLAYBACKSTATUS}" = "SUCCESS"]?ended)
 ; file missing or unreadable
 same => n,Playback(beeperr)
 same => n,Goto(next)
 same => n(stopped),Set(VK=${CPLAYBACKSTOPKEY})
 same => n,Goto(key)
 ; played to the end: heard (like the web player). GotoIf, not ExecIf: the CURL in an ExecIf line
 ; would run before the condition is checked.
 same => n(ended),GotoIf($["${V_NEW}" != "1"]?wait)
 same => n,Set(VR=${CURL(http://pbx:${PBX_INTERNAL_KEY}@127.0.0.1:8081/internal/voicemail/action,ext=${FC_EXT}&id=${V_ID}&action=heard)})
 same => n(wait),WaitDigit(5)
 same => n,GotoIf($["${WAITDIGITSTATUS}" != "DTMF"]?next)
 same => n,Set(VK=${WAITDIGITRESULT})
 same => n(key),GotoIf($["${VK}" = "5" | "${VK}" = "1"]?play)
 same => n,GotoIf($["${VK}" = "6" | "${VK}" = "2"]?next)
 same => n,GotoIf($["${VK}" = "4"]?prev)
 same => n,GotoIf($["${VK}" = "7"]?delete)
 same => n,GotoIf($["${VK}" = "9"]?save)
 same => n,GotoIf($["${VK}" = "*" | "${VK}" = "0"]?help)
 same => n,GotoIf($["${VK}" = "#"]?bye)
 same => n,Goto(wait)
 same => n(skip),GotoIf($[${VDIR} < 0]?prev:next)
 same => n(next),Set(VDIR=1)
 same => n,GotoIf($[${VI} >= ${VQ}]?end)
 same => n,Set(VI=$[${VI} + 1])
 same => n,Goto(play)
 same => n(prev),Set(VDIR=-1)
 same => n,GotoIf($[${VI} <= 1]?first)
 same => n,Set(VI=$[${VI} - 1])
 same => n,Goto(play)
 same => n(first),Playback(vm-nomore)
 same => n,Set(VDIR=1)
 same => n,Goto(wait)
 same => n(delete),Set(VR=${CURL(http://pbx:${PBX_INTERNAL_KEY}@127.0.0.1:8081/internal/voicemail/action,ext=${FC_EXT}&id=${V_ID}&action=delete)})
 same => n,GotoIf($["${VR}" != "ok"]?failed)
 same => n,Set(VDEL_${V_ID}=1)
 same => n,Playback(vm-message&vm-deleted)
 same => n,Goto(next)
 same => n(save),Set(VR=${CURL(http://pbx:${PBX_INTERNAL_KEY}@127.0.0.1:8081/internal/voicemail/action,ext=${FC_EXT}&id=${V_ID}&action=heard)})
 same => n,GotoIf($["${VR}" != "ok"]?failed)
 same => n,Playback(vm-message&vm-saved)
 same => n,Goto(next)
 same => n(failed),Playback(beeperr)
 same => n,Goto(wait)
 ; key menu (app_voicemail prompts: 4 previous, 5 repeat, 6 next, 7 delete, 9 save, * help, # exit).
 ; Read with terminator A (never sent by phones), so # arrives as a key like the others.
 same => n(help),Read(VK,vm-prev&vm-repeat&vm-next&vm-delete&vm-savemessage&vm-helpexit,1,t(A),1,10)
 same => n,GotoIf($["${VK}" = ""]?wait:key)
 ; after the last message: "no more messages", then a last chance for a key
 same => n(end),Read(VK,vm-nomore,1,t(A),1,10)
 same => n,GotoIf($["${VK}" = ""]?bye:key)
 same => n(none),Playback(vm-no&vm-messages)
 same => n(bye),Playback(vm-goodbye)
 same => n,Hangup()

; number of messages; German "eine" for 1 (feminine, "eine neue Nachricht")
exten => vm-count,1,ExecIf($["${CHANNEL(language)}" = "de" & ${ARG1} = 1]?Playback(digits/1F):SayNumber(${ARG1}))
 same => n,Return()

; --- IVR ------------------------------------------------------------------------------
; ARG1 = ivrs.id. Play greeting, read one digit (Read stops the prompt on keypress),
; digit → target. No/invalid input: repeat the prompt, then timeout_target.
; Mirrored in patchbay-web flow.rs (call flow diagram): keep both in sync.

[sub-ivr]
exten => s,1,Set(II=${ODBC_IVR_INFO(${ARG1})})
 same => n,GotoIf($["${II}" = ""]?invalid)
 same => n,Set(ARRAY(IV_GREETING,IV_TIMEOUT,IV_REPEAT,IV_TIMEOUT_T,IV_INVALID)=${II})
 same => n,UserEvent(PbxTarget,Kind: ivr,Number: ${ARG1},Did: ${PBX_DID})
 same => n,Set(IV_WRONG=0)
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,Set(IV_ROUND=0)
 same => n,Set(IV_KEYS=${ODBC_IVR_DIGITS(${ARG1})})
 same => n(again),Set(IV_ROUND=$[${IV_ROUND} + 1])
 same => n,GotoIf($["${IV_INVALID}" = "ignore"]?listen)
 same => n,Read(IV_DIGIT,${IF($["${IV_GREETING}" != ""]?pbx/${IV_GREETING}:silence/1)},1,,1,${IV_TIMEOUT})
 same => n,Goto(gotdigit)
 ; "ignore" mode: only assigned keys interrupt the greeting; other keys have no effect at all.
 ; ControlPlayback stops on the assigned keys (ff/rew/pause/restart mapped to unused DTMF A–D).
 same => n(listen),Set(IV_DIGIT=)
 same => n,GotoIf($["${IV_GREETING}" = ""]?wait)
 same => n,GotoIf($["${IV_KEYS}" = ""]?playonly)
 same => n,ControlPlayback(pbx/${IV_GREETING},0,A,B,${IV_KEYS},C,D)
 same => n,ExecIf($["${CPLAYBACKSTATUS}" = "USERSTOPPED"]?Set(IV_DIGIT=${CPLAYBACKSTOPKEY}))
 same => n,GotoIf($["${IV_DIGIT}" != ""]?gotdigit)
 same => n,Goto(wait)
 same => n(playonly),Playback(pbx/${IV_GREETING})
 same => n(wait),GotoIf($["${IV_KEYS}" = ""]?nodigit)
 same => n,WaitDigit(${IV_TIMEOUT},${IV_KEYS})
 same => n,ExecIf($["${WAITDIGITSTATUS}" = "DTMF"]?Set(IV_DIGIT=${WAITDIGITRESULT}))
 same => n(gotdigit),NoOp(IVR ${ARG1} key ${IV_DIGIT})
 same => n,GotoIf($["${IV_DIGIT}" = ""]?nodigit)
 same => n,Set(IV_T=${ODBC_IVR_OPTION(${ARG1},${IV_DIGIT})})
 same => n,GotoIf($["${IV_T}" = ""]?wrong)
 same => n,Gosub(sub-target,s,1(${IV_T}))
 same => n,Goto(done)
 same => n(wrong),Playback(invalid)
 same => n(nodigit),GotoIf($[${IV_ROUND} <= ${IV_REPEAT}]?again)
 same => n,GotoIf($["${IV_TIMEOUT_T}" = "0"]?done)
 same => n,Gosub(sub-target,s,1(${IV_TIMEOUT_T}))
 same => n,Goto(done)
 same => n(invalid),Answer()
 same => n,Playback(ss-noservice)
 same => n(done),Return()

; --- Transfer recall --------------------------------------------------------------------
; A blind transfer to a person or group that is not answered rings the transferring person once
; more ("Recall <caller>") before the target's no-answer rule applies. Setting transfer_recall_s
; (PBX_TRANSFER_RECALL_S, 0 = off) caps the ring time at the target.

; ARG1 = number, ARG2 = normal ring time. Sets XR_T (ring time to use).
[sub-recall-time]
exten => s,1,Set(XR_T=${ARG2})
 same => n,GotoIf($["${XF_TO}" != "${ARG1}" | "${XF_RECALLED}" != ""]?done)
 same => n,Set(XR_S=${ODBC_SETTING(transfer_recall_s)})
 same => n,ExecIf($[0${XR_S} > 0 & 0${XR_S} < ${ARG2}]?Set(XR_T=${XR_S}))
 same => n(done),Return()

; ARG1 = number that did not answer. Sets XR=1 when the transferring person took the call back.
[sub-recall]
exten => s,1,Set(XR=0)
 same => n,GotoIf($["${XF_TO}" != "${ARG1}" | "${XF_RECALLED}" != ""]?done)
 same => n,GotoIf($[0${ODBC_SETTING(transfer_recall_s)} = 0]?done)
 same => n,Set(XF_RECALLED=1)
 same => n,Set(XF=${CUT(XF_BY,-,1)})
 same => n,GotoIf($["${XF:0:6}" != "PJSIP/"]?done)
 same => n,Set(CI=${ODBC_CALLER_INFO(${XF:6})})
 same => n,GotoIf($["${CI}" = ""]?done)
 same => n,Set(ARRAY(XR_EXT,XR_CL,XR_DID)=${CI})
 same => n,GotoIf($["${XR_EXT}" = "${ARG1}"]?done)
 same => n,Set(XR_INFO=${ODBC_USER_INFO(${XR_EXT})})
 same => n,Set(ARRAY(XR_ACTIVE,XR_DND,XR_TIMEOUT,XR_LANG)=${XR_INFO})
 same => n,GotoIf($["${XR_ACTIVE}" != "1"]?done)
 same => n,UserEvent(PbxRecall,Number: ${ARG1},To: ${XR_EXT})
 same => n,Set(_PBX_CNPFX=${IF($["${XR_LANG}" = "de"]?Rückruf:Recall)})
 same => n,Dial(Local/${XR_EXT}@group-member,${XR_TIMEOUT},c)
 same => n,Set(_PBX_CNPFX=)
 same => n,ExecIf($["${DIALSTATUS}" = "ANSWER"]?Set(XR=1))
 same => n(done),Return()

; --- Call a group ----------------------------------------------------------------
; ARG1 = group number. Strategies: ringall (all at once), linear (one after another by priority),
; rrmemory (one after another, round-robin start). Members ring via group-member, without their forwards.
; Queue mode (groups.queue): callers wait in line in app_queue (queue g<id>, realtime views
; queue_rt/queue_members_rt), only free members ring, position announcements.
; Mirrored in patchbay-web flow.rs (call flow diagram): keep both in sync.

[sub-group]
exten => s,1,Set(GI=${ODBC_GROUP_INFO(${ARG1})})
 same => n,GotoIf($["${GI}" = ""]?invalid)
 same => n,Set(ARRAY(G_ID,G_STRAT,G_MEMBER_T,G_TOTAL_T,G_MOH,G_NOANSWER,G_PFX,G_QUEUE,G_LANG)=${GI})
 same => n,UserEvent(PbxTarget,Kind: group,Number: ${ARG1},Did: ${PBX_DID})
 ; optional announcement before ringing
 same => n,Set(G_ANN=${ODBC_GROUP_ANNOUNCE(${ARG1})})
 same => n,ExecIf($["${G_ANN}" != ""]?Answer())
 same => n,ExecIf($["${G_ANN}" != ""]?Playback(pbx/${G_ANN}))
 same => n,Set(G_MEMBERS=${ODBC_GROUP_MEMBERS(${ARG1})})
 same => n,GotoIf($["${G_MEMBERS}" = ""]?noanswer)
 same => n,Set(G_N=${FIELDQTY(G_MEMBERS,-)})
 ; m(class): music on hold instead of ringback (G_MOH = class or empty), c: "answered elsewhere"
 same => n,Set(G_OPTS=c)
 same => n,ExecIf($["${G_MOH}" != ""]?Set(G_OPTS=m(${G_MOH})c))
 ; caller name prefix (e.g. "DSUP"): only on the members' ringing legs ([group-member]), the
 ; caller's own channel keeps the plain name (voicemail, call list, later transfers)
 same => n,Set(_PBX_CNPFX=${G_PFX})
 same => n,Gosub(sub-recall-time,s,1(${ARG1},${G_TOTAL_T}))
 same => n,Set(G_TOTAL_T=${XR_T})
 same => n,Set(G_END=$[${EPOCH} + ${G_TOTAL_T}])
 same => n,GotoIf($["${G_QUEUE}" = "1"]?queue)
 same => n,GotoIf($["${G_STRAT}" = "ringall"]?ringall)
 ; linear / rrmemory
 same => n,Set(G_START=1)
 same => n,ExecIf($["${G_STRAT}" = "rrmemory"]?Set(G_START=$[(0${DB(pbx_rr/${ARG1})} % ${G_N}) + 1]))
 same => n,Set(I=0)
 same => n(next),GotoIf($[${I} >= ${G_N} | ${EPOCH} >= ${G_END}]?noanswer)
 same => n,Set(POS=$[((${G_START} - 1 + ${I}) % ${G_N}) + 1])
 same => n,Set(EXT=${CUT(G_MEMBERS,-,${POS})})
 same => n,ExecIf($["${G_STRAT}" = "rrmemory"]?Set(DB(pbx_rr/${ARG1})=${POS}))
 same => n,Set(T=$[${G_END} - ${EPOCH}])
 same => n,Set(T=${IF($[${T} > ${G_MEMBER_T}]?${G_MEMBER_T}:${T})})
 same => n,Dial(Local/${EXT}@group-member,${T},${G_OPTS})
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,Set(I=$[${I} + 1])
 same => n,Goto(next)
 same => n(ringall),Set(G_DIAL=)
 same => n,Set(I=1)
 same => n(rnext),Set(G_DIAL=${G_DIAL}${IF($["${G_DIAL}" != ""]?&)}Local/${CUT(G_MEMBERS,-,${I})}@group-member)
 same => n,Set(I=$[${I} + 1])
 same => n,GotoIf($[${I} <= ${G_N}]?rnext)
 same => n,Dial(${G_DIAL},${G_TOTAL_T},${G_OPTS})
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,Goto(noanswer)
 ; queue: prompts ("you are caller number 2") in the group's language; r = ringback instead of
 ; music, C = "answered elsewhere". Without the c option the caller is hung up after an answered
 ; call; Queue() returns only when nobody answered within the total time (QUEUESTATUS).
 ; answer first: hold music and position announcements as early media often do not reach mobile callers
 same => n(queue),Answer()
 same => n,Set(G_CLANG=${CHANNEL(language)})
 same => n,Set(CHANNEL(language)=${G_LANG})
 same => n,Queue(g${G_ID},${IF($["${G_MOH}" = ""]?r)}C,,,${G_TOTAL_T})
 same => n,Set(CHANNEL(language)=${G_CLANG})
 same => n(noanswer),UserEvent(PbxNoAnswer,Number: ${ARG1})
 same => n,Set(_PBX_CNPFX=)
 same => n,Gosub(sub-recall,s,1(${ARG1}))
 same => n,GotoIf($["${XR}" = "1"]?done)
 same => n,GotoIf($["${G_NOANSWER}" = "0"]?unavailable)
 same => n,Gosub(sub-target,s,1(${G_NOANSWER}))
 same => n,Goto(done)
 same => n(unavailable),Answer()
 same => n,Playback(vm-nobodyavail)
 same => n,Goto(done)
 same => n(invalid),Answer()
 same => n,Playback(invalid)
 same => n(done),Set(_PBX_CNPFX=)
 same => n,Return()

; One group member: ring only their devices, no forward, no mailbox. PBX_CNPFX (inherited from
; sub-group / sub-recall) goes in front of the caller name shown on this member's devices.
[group-member]
exten => _[1-9]XXX,1,Set(D=${ODBC_USER_DIAL(${EXTEN})})
 same => n,GotoIf($["${D}" = ""]?gone)
 ; caller name from this member's own contacts (this Local channel only)
 same => n,Set(GM_KN=${ODBC_CONTACT_NAME(${EXTEN},${CALLERID(num)})})
 same => n,GotoIf($[${LEN(${GM_KN})} = 0]?pfx)
 same => n,Set(CALLERID(name)=${GM_KN})
 same => n(pfx),GotoIf($["${PBX_CNPFX}" = ""]?dial)
 same => n,Set(GM_N=${CALLERID(name)})
 same => n,GotoIf($[${LEN(${GM_N})} > 0]?named)
 same => n,Set(GM_N=${CALLERID(num)})
 same => n(named),Set(CALLERID(name)=${PBX_CNPFX} ${GM_N})
 same => n(dial),Dial(${D},,cb(pbx-xheaders^s^1))
 same => n(gone),Hangup()

; --- Outbound via outbound_routes -----------------------------------------------
; ARG1 = dialed number (national, international or E.164)
; Replayed by patchbay-web routetest.rs (route tester): keep both in sync.

[sub-outbound]
; one-shot permission for an admin-configured external target (forward, DID/IVR target)
exten => s,1,Set(AX=${PBX_ALLOW_EXTERNAL})
 same => n,Set(PBX_ALLOW_EXTERNAL=)
 ; one-shot: external target set by a person (self-service forward), checked with that person's classes
 same => n,Set(FO=${PBX_FWD_OWNER})
 same => n,Set(PBX_FWD_OWNER=)
 ; normalise (same as admin::normalise_with in patchbay-web; CC = PBX_COUNTRY_CODE, e.g. 49):
 ; 00 -> +, +CC0 -> +CC, +CC -> 0, + -> 00, 0 + emergency number -> emergency number (0112 -> 112).
 ; Without a country code (X never matches) only the generic steps apply.
 same => n,Set(CC=${IF($["${PBX_COUNTRY_CODE}" = ""]?X:${PBX_COUNTRY_CODE})})
 same => n,Set(CCL=${LEN(+${CC})})
 same => n,Set(CCL0=$[${CCL} + 1])
 same => n,Set(N=${FILTER(0123456789+,${ARG1})})
 same => n,ExecIf($["${N:0:2}" = "00"]?Set(N=+${N:2}))
 same => n,ExecIf($["${N:0:${CCL0}}" = "+${CC}0"]?Set(N=+${CC}${N:${CCL0}}))
 same => n,ExecIf($["${N:0:${CCL}}" = "+${CC}"]?Set(N=0${N:${CCL}}))
 same => n,ExecIf($["${N:0:1}" = "+"]?Set(N=00${N:1}))
 same => n,ExecIf($["${N:0:1}" = "0" & "${N:1}" != "" & ${FIELDNUM(PBX_EMERGENCY_NUMBERS,-,${N:1})} > 0]?Set(N=${N:1}))
 ; Who is calling: click-to-call user, own device, or a call that arrived via a trunk
 same => n,Set(C_CLASSES=)
 same => n,Set(C_DID=)
 same => n,Set(C_EXT=)
 same => n,Set(C_DEVICE=0)
 same => n,Set(C_TRUNK=)
 ; Blind transfer (SIP REFER): the transferer's rights count, never those of the transferred
 ; party (an external caller would otherwise dial out with the trunk's classes)
 same => n,GotoIf($["${BLINDTRANSFER}" = ""]?c2c)
 same => n,Set(XF=${CUT(BLINDTRANSFER,-,1)})
 same => n,GotoIf($["${XF:0:6}" != "PJSIP/"]?deny)
 same => n,Set(CI=${ODBC_CALLER_INFO(${XF:6})})
 same => n,GotoIf($["${CI}" = ""]?deny)
 same => n,Set(ARRAY(C_EXT,C_CLASSES,C_DID)=${CI})
 same => n,Goto(route)
 same => n(c2c),GotoIf($["${PBX_C2C_EXT}" = ""]?device)
 same => n,Set(UC=${ODBC_USER_CLASSES(${PBX_C2C_EXT})})
 same => n,ExecIf($["${UC}" != ""]?Set(ARRAY(C_CLASSES,C_DID)=${UC}))
 same => n,Set(C_EXT=${PBX_C2C_EXT})
 same => n,Goto(route)
 same => n(device),GotoIf($["${CHANNEL(channeltype)}" != "PJSIP"]?trunk)
 same => n,Set(CI=${ODBC_CALLER_INFO(${CHANNEL(endpoint)})})
 same => n,GotoIf($["${CI}" = ""]?trunk)
 same => n,Set(ARRAY(C_EXT,C_CLASSES,C_DID)=${CI})
 same => n,Set(C_DEVICE=1)
 same => n,Goto(route)
 ; Calls that came in via a trunk use the trunk's classes (PBX_TRUNK is set by the trunk config)
 same => n(trunk),GotoIf($["${PBX_TRUNK}" = ""]?route)
 same => n,Set(C_TRUNK=${PBX_TRUNK})
 same => n,Set(C_CLASSES=${ODBC_TRUNK_CLASSES(${PBX_TRUNK})})
 ; self-service forward: only the permission check uses the owner's classes (an unknown, locked or
 ; deleted owner has none -> deny); caller ID / outbound DID stay those of the caller as determined above
 same => n(route),GotoIf($["${FO}" = ""]?lookup)
 same => n,Set(UC=${ODBC_USER_CLASSES(${FO})})
 same => n,Set(C_CLASSES=${CUT(UC,\,,1)})
 same => n(lookup),Set(R=${ODBC_ROUTE(${N})})
 ; no answer from the database: emergency calls still go out over the site's fallback trunk
 same => n,GotoIf($["${R}" = "" & "${N}" != "" & ${FIELDNUM(PBX_EMERGENCY_NUMBERS,-,${N})} > 0]?sos)
 same => n,GotoIf($["${R}" = ""]?invalid)
 same => n,Set(ARRAY(R_ACTION,R_TRUNK,R_STRIP,R_PREPEND,R_CLASS,R_CLIPMODE,R_CLIP,R_KIND,R_MAX)=${R})
 same => n,GotoIf($["${R_ACTION}" = "deny"]?deny)
 same => n,GotoIf($["${R_ACTION}" != "route"]?invalid)
 same => n,GotoIf($["${R_TRUNK}" = ""]?deny)
 ; IAX network: never back out over the peer the call came in on (loops); for SIP providers
 ; hairpinning (e.g. mobile fallback) is legitimate
 same => n,GotoIf($["${R_KIND}" = "iax2" & "${C_TRUNK}" = "${R_TRUNK}"]?deny)
 ; emergency calls: always for own devices; trunks only with class "emergency"
 same => n,GotoIf($["${R_CLASS}" = "emergency" & "${C_DEVICE}" = "1"]?dial)
 ; admin-configured external target (one-shot, exact number), also for calls that came in via a trunk
 same => n,GotoIf($["${AX}" != "" & "${AX}" = "${ARG1}"]?dial)
 ; Check permissions, deny when in doubt (fail closed)
 same => n,GotoIf($["${C_CLASSES}" = ""]?deny)
 same => n,GotoIf($[${FIELDNUM(C_CLASSES,-,${R_CLASS})} = 0]?deny)
 ; channel limit per trunk
 same => n(dial),Set(GROUP(trunk)=${R_TRUNK})
 ; channel limit per trunk (never for emergency calls)
 same => n,GotoIf($["${R_CLASS}" != "emergency" & ${R_MAX} > 0 & ${GROUP_COUNT(${R_TRUNK}@trunk)} > ${R_MAX}]?busy)
 same => n,Set(DN=${R_PREPEND}${N:${R_STRIP}})
 same => n,GotoIf($["${R_KIND}" = "iax2"]?iax)
 same => n,Set(CLIP=${IF($["${R_CLIPMODE}" = "user" & "${C_DID}" != ""]?${C_DID}:${R_CLIP})})
 same => n,ExecIf($["${CLIP:0:${CCL}}" = "+${CC}"]?Set(CALLERID(num)=0${CLIP:${CCL}}))
 ; emergency call: remember the caller for the control centre's callback (from-sip-trunk, 30 min)
 same => n,ExecIf($["${R_CLASS}" = "emergency" & "${C_EXT}" != ""]?Set(DB(pbx_sos/${R_TRUNK})=${EPOCH}:${C_EXT}))
 same => n,Dial(PJSIP/${DN}@${R_TRUNK},,)
 same => n,Goto(done)
 ; IAX network: the caller ID stays the plain extension (the receiving site puts its prefix for us
; in front, trunk-in); path of site ids for loop detection
 same => n(iax),Set(SID=${ODBC_SETTING(sip_realm)})
 same => n,ExecIf($["${IAXVAR(PBX_PATH)}" = ""]?Set(IAXVAR(PBX_PATH)=${SID}))
 same => n,Dial(IAX2/${R_TRUNK}/${DN},,)
 same => n,Goto(done)
 same => n(busy),Busy(3)
 same => n,Goto(done)
 same => n(sos),NoOp(Emergency fallback: no route from the database)
 same => n,GotoIf($["${PBX_EMERGENCY_TRUNK}" = ""]?invalid)
 same => n,ExecIf($["${C_EXT}" != ""]?Set(DB(pbx_sos/${PBX_EMERGENCY_TRUNK})=${EPOCH}:${C_EXT}))
 same => n,Dial(PJSIP/${N}@${PBX_EMERGENCY_TRUNK},,)
 same => n,Goto(done)
 same => n(deny),Answer()
 same => n,Playback(ss-noservice)
 same => n,Goto(done)
 same => n(invalid),Answer()
 same => n,Playback(invalid)
 same => n(done),Return()

; --- Internal numbers (own devices, trunk rules, alias apps) --------------------------------
; Replayed by patchbay-web routetest.rs (route tester): keep both in sync.

[sub-internal]
; ARG1 = internal number, ARG2 = allowed kinds ("person-group-ivr-app-device"; custom and company apps count as app)
exten => s,1,Set(IN=${ARG1})
 ; remembered for alias apps, which must not widen what the trunk rule allows
 same => n,Set(PBX_KINDS=${ARG2})
 same => n,Set(K=${ODBC_NUMBER_KIND(${IN})})
 same => n,GotoIf($["${K}" = ""]?invalid)
 same => n,Set(KR=${IF($["${K}" = "custom_app" | "${K}" = "company_app"]?app:${K})})
 same => n,GotoIf($[${FIELDNUM(ARG2,-,${KR})} = 0]?invalid)
 same => n,Goto(${K},1)
 same => n(invalid),Answer()
 same => n,Playback(invalid)
 same => n,Return()
exten => person,1,Gosub(sub-user,s,1(${IN}))
 same => n,Return()
exten => group,1,Gosub(sub-group,s,1(${IN}))
 same => n,Return()
exten => ivr,1,Gosub(sub-ivr,s,1(${ODBC_IVR_BY_NUMBER(${IN})}))
 same => n,Return()
exten => device,1,Set(DEV=${ODBC_DEVICE_DIAL(${IN})})
 same => n,GotoIf($["${DEV}" = ""]?s,invalid)
 same => n,Dial(${DEV},30,b(pbx-xheaders^s^1))
 same => n,Return()
exten => app,1,Gosub(sub-app,s,1(${IN}))
 same => n,Return()
exten => company_app,1,Gosub(sub-app,s,1(${IN}))
 same => n,Return()
exten => custom_app,1,Set(CAPP=${ODBC_CUSTOM_APP(${IN})})
 same => n,GotoIf($["${CAPP}" = ""]?s,invalid)
 ; the context is missing when the template could not be rendered or was blocked by the guard
 same => n,GotoIf($[${DIALPLAN_EXISTS(app-custom-${CAPP},s,1)}]?:s,invalid)
 same => n,Goto(app-custom-${CAPP},s,1)

; --- Inbound IAX network --------------------------------------------------------------------
; PBX_TRUNK is set per peer (setvar in the generated iax config).

[from-iax]
exten => _X.,1,NoOp(IAX ${PBX_TRUNK}: ${EXTEN} from ${CALLERID(num)})
 same => n,GotoIf($["${PBX_TRUNK}" = ""]?reject)
 ; loop protection: path of site ids (settings.sip_realm = PBX_SIP_REALM) travels with the call (patchbay-web sites only)
 same => n,Set(SID=${ODBC_SETTING(sip_realm)})
 same => n,Set(PATH=${IAXVAR(PBX_PATH)})
 same => n,GotoIf($["${PATH}" != "" & ${FIELDNUM(PATH,/,${SID})} > 0]?reject)
 same => n,GotoIf($[${FIELDQTY(PATH,/)} >= 4]?reject)
 same => n,Set(IAXVAR(PBX_PATH)=${IF($["${PATH}" = ""]?${SID}:${PATH}/${SID})})
 same => n,Goto(trunk-in,${EXTEN},1)
 same => n(reject),Hangup(21)

; --- Inbound via trunk rules (IAX peers, SIP trunks in passthrough mode) ------------
; PBX_TRUNK is set by the peer/endpoint; the number is matched against trunk_inbound_rules.

[trunk-in]
exten => _X.,1,NoOp(Trunk ${PBX_TRUNK}: ${EXTEN} from ${CALLERID(num)})
 same => n,GotoIf($["${PBX_TRUNK}" = ""]?reject)
 ; channel limit
 same => n,Set(TI=${ODBC_TRUNK_INFO(${PBX_TRUNK})})
 same => n,GotoIf($["${TI}" = ""]?reject)
 same => n,Set(ARRAY(T_SITE,T_MAX)=${TI})
 same => n,Set(GROUP(trunkin)=${PBX_TRUNK})
 same => n,GotoIf($[${T_MAX} > 0 & ${GROUP_COUNT(${PBX_TRUNK}@trunkin)} > ${T_MAX}]?busy)
 ; caller ID: short numbers get the peer's site prefix (extension padded to 4 digits)
 same => n,Set(CN=${FILTER(0123456789,${CALLERID(num)})})
 same => n,Set(PAD=0000${CN})
 same => n,ExecIf($[${LEN(${CN})} > 0 & ${LEN(${CN})} <= 4 & "${T_SITE}" != ""]?Set(CALLERID(num)=${T_SITE}${PAD:-4}))
 ; dialled number: strip leading zeros (01020 -> 1020)
 same => n,Set(N=${FILTER(0123456789,${EXTEN})})
 same => n,While($["${N:0:1}" = "0"])
 same => n,Set(N=${N:1})
 same => n,EndWhile()
 same => n,GotoIf($["${N}" = ""]?reject)
 same => n,Set(RL=${ODBC_TRUNK_RULE(${PBX_TRUNK},${N})})
 same => n,GotoIf($["${RL}" = ""]?reject)
 same => n,Set(ARRAY(RL_ACTION,RL_KINDS,RL_TARGET)=${RL})
 same => n,GotoIf($["${RL_ACTION}" = "internal"]?internal)
 same => n,GotoIf($["${RL_ACTION}" = "target" & "${RL_TARGET}" != "0"]?target)
 same => n,GotoIf($["${RL_ACTION}" = "outbound"]?outbound)
 same => n,Goto(reject)
 same => n(internal),Gosub(sub-internal,s,1(${N},${RL_KINDS}))
 same => n,Hangup()
 same => n(target),Gosub(sub-target,s,1(${RL_TARGET}))
 same => n,Hangup()
 ; transit: the original number (leading zeros matter for the dial rules), N was only for rule matching
 same => n(outbound),Gosub(sub-outbound,s,1(${FILTER(0123456789,${EXTEN})}))
 same => n,Hangup()
 same => n(busy),Busy(3)
 same => n(reject),Hangup(21)

; --- Inbound SIP trunks (DID and passthrough mode; endpoints generated by patchbay-web with context = from-sip-trunk) -------------------------------
; Mirrored in patchbay-web flow.rs (call flow diagram): keep both in sync.

[from-sip-trunk]
exten => _X.,1,Set(E=${EXTEN})
 same => n,Goto(did,1)
exten => _+X.,1,Set(E=${EXTEN})
 same => n,Goto(did,1)
exten => s,1,Set(E=)
 same => n,Goto(did,1)

exten => did,1,NoOp(SIP trunk ${PBX_TRUNK}: called ${E}, caller ${CALLERID(num)})
 same => n,Set(TI=${ODBC_TRUNK_INFO(${PBX_TRUNK})})
 same => n,GotoIf($["${TI}" = ""]?nodid)
 same => n,Set(ARRAY(T_SITE,T_MAX,T_MODE)=${TI})
 ; admin blocklist (admin page "Blocklist"), for SIP trunks in both modes: busy, nothing tells the
 ; caller it was blocked. IAX2 peers (from-iax) are not checked: their callers are other sites' extensions.
 same => n,GotoIf($["${ODBC_CALLER_BLOCKED(${CALLERID(num)})}" = "1"]?blocked)
 ; passthrough trunks (e.g. Eventphone) route by trunk rules like IAX peers
 same => n,GotoIf($["${T_MODE}" = "passthrough" & "${FILTER(0123456789,${E})}" != ""]?trunk-in,${FILTER(0123456789,${E})},1)
 ; called number to E.164 (CC = PBX_COUNTRY_CODE, e.g. 49)
 ; "CC…" is either already international or a national number whose area code starts with CC,
 ; written without the 0: prefer whichever is an own number
 same => n,Set(CC=${IF($["${PBX_COUNTRY_CODE}" = ""]?X:${PBX_COUNTRY_CODE})})
 same => n,ExecIf($["${E:0:${LEN(${CC})}}" = "${CC}"]?Set(E=${IF($["${ODBC_DID_TARGET(+${CC}${E})}" != ""]?+${CC}${E}:+${E})}))
 same => n,ExecIf($["${E:0:2}" = "00"]?Set(E=+${E:2}))
 same => n,ExecIf($["${E:0:1}" = "0"]?Set(E=+${CC}${E:1}))
 same => n,ExecIf($["${E:0:1}" != "+" & "${E}" != ""]?Set(E=+${CC}${E}))
 same => n,Set(TGT=${ODBC_DID_TARGET(${E})})
 same => n,ExecIf($["${TGT}" = ""]?Set(E=${ODBC_TRUNK_DID(${PBX_TRUNK})}))
 same => n,ExecIf($["${TGT}" = ""]?Set(TGT=${ODBC_DID_TARGET(${E})}))
 same => n,Set(__PBX_DID=${E})
 ; control centre callback: up to 30 min after an emergency call over this trunk (sub-outbound), any
 ; incoming call first rings the emergency caller's phones directly (25 s, past DND and forwards),
 ; then takes the normal way. The control centre calls back from numbers we cannot know.
 same => n,Set(SOS=${DB(pbx_sos/${PBX_TRUNK})})
 same => n,GotoIf($["${SOS}" = ""]?route)
 same => n,GotoIf($[${EPOCH} - 0${CUT(SOS,:,1)} > 1800]?route)
 same => n,Set(SOS_D=${ODBC_USER_DIAL(${CUT(SOS,:,2)})})
 same => n,GotoIf($["${SOS_D}" = ""]?route)
 same => n,NoOp(Callback after emergency call: ringing ${CUT(SOS,:,2)} first)
 same => n,Set(SOS_N=${CALLERID(name)})
 same => n,Set(CALLERID(name)=SOS ${CALLERID(num)})
 same => n,Dial(${SOS_D},25,b(pbx-xheaders^s^1))
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?answered)
 same => n,Set(CALLERID(name)=${SOS_N})
 same => n(route),NoOp()
 ; caller names from personal contacts are set per called person (sub-user, group-member)
 same => n,GotoIf($["${TGT}" = ""]?nodid)
 same => n,Gosub(sub-target,s,1(${TGT}))
 same => n,Hangup()
 same => n(answered),Hangup()
 same => n(blocked),NoOp(Blocked caller ${CALLERID(num)})
 same => n,Hangup(17)
 same => n(nodid),Answer()
 same => n,Playback(ss-noservice)
 same => n,Hangup()

; --- Busy lamps (hints) -----------------------------------------------------------

[hints]
; Busy lamps: one hint per person over all of their devices, generated by patchbay-web from the database
; (refreshed every 30 s when something changed).
#tryinclude /etc/asterisk-generated/hints.conf

; --- Ring delay per device: Local/<seconds>-<sip_username>@ring-delay (built by ODBC_USER_DIAL) --------
; --- Call context for SIP devices (pre-dial handler on each device leg, Dial option b) ------------
; Voice assistants and other SIP endpoints (e.g. devices with a fixed address) learn who calls and on
; which number, without an API: X-PBX-Caller (number), X-PBX-Caller-Name, X-PBX-DID (own number the
; call came in on, E.164, empty for internal calls). Phones ignore X- headers. Local legs (ring
; delay) get them when their own PJSIP leg is dialled.
[pbx-xheaders]
exten => s,1,GotoIf($["${CHANNEL(channeltype)}" != "PJSIP"]?done)
 same => n,Set(PJSIP_HEADER(add,X-PBX-Caller)=${CALLERID(num)})
 same => n,ExecIf($["${CALLERID(name)}" != ""]?Set(PJSIP_HEADER(add,X-PBX-Caller-Name)=${CALLERID(name)}))
 same => n,ExecIf($["${PBX_DID}" != ""]?Set(PJSIP_HEADER(add,X-PBX-DID)=${PBX_DID}))
 same => n(done),Return()

[ring-delay]
exten => _[0-9].,1,Set(RD_S=${CUT(EXTEN,-,1)})
 same => n,Set(RD_DEV=${CUT(EXTEN,-,2)})
 same => n,Wait(${RD_S})
 same => n,Dial(PJSIP/${RD_DEV},,b(pbx-xheaders^s^1))
 same => n,Hangup()

; --- Click-to-call and ring test (originated by patchbay-web via AMI) ---------------------------
; Click-to-call: the user's devices ring first (Local/<ext>@group-member); once answered, the
; dialled number is processed like a call from one of the user's devices.
[click2call]
exten => _[0-9*+].,1,Set(CALLERID(num)=${PBX_C2C_EXT})
 same => n,Set(CALLERID(name)=${PBX_C2C_NAME})
 same => n,Goto(from-device,${EXTEN},1)
exten => _X,1,Goto(from-device,${EXTEN},1)

; Ring test: plays a short announcement on the device that answered
[ring-test]
exten => s,1,Answer()
 same => n,Wait(0.5)
 same => n,Playback(demo-congrats)
 same => n,Hangup()

; Test contexts (bypass permission checks) are not part of production. On a test system mount
; asterisk/test/extensions_test.conf to /etc/asterisk-test/ (see the file header).
#tryinclude /etc/asterisk-test/extensions_test.conf

#tryinclude /etc/asterisk-generated/extensions_custom.conf
