; Call features. Transfers are done by the phones (SIP REFER, blind or attended); no Dial() uses
; the t/T options, so there is no DTMF transfer feature map. Pickup *8 / *8<ext> is in the dialplan
; ([feature-codes] in extensions.conf).
[general]
pickupexten = *8
