; Call features. Transfers are done by the phones (SIP REFER, blind or attended); no Dial() uses
; the t/T options, so there is no DTMF transfer feature map. Pickup *8 / *8<ext> is in the dialplan
; ([feature-codes] in extensions.conf).
[general]
pickupexten = *8

; own additions of the site ($PBX_DIR/config/asterisk/features.d/*.conf, docs/configuration.md "Own Asterisk configuration");
; each file starts with its own [section] (modules.d: load/noload lines may follow directly)
#tryinclude /etc/asterisk-custom/features.d/*.conf
