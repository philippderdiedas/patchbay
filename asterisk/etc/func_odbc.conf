; Data access from the dialplan. All queries are read-only.

; A person's devices as dial string, e.g. "PJSIP/abc&PJSIP/def"
[USER_DIAL]
dsn = pbx
readsql = SELECT COALESCE(string_agg(CASE WHEN ring_delay_s > 0 THEN 'Local/' || ring_delay_s || '-' || sip_username || '@ring-delay' ELSE 'PJSIP/' || sip_username END, '&' ORDER BY ring_order, id), '') FROM active_devices WHERE extension = '${SQL_ESC(${ARG1})}' AND ring

; A person's mobile phones (devices of type mobile, ringing on) as Local legs into ring-mobile,
; e.g. "Local/0-12@ring-mobile&Local/10-15@ring-mobile" (delay-device id); appended in sub-user only
[USER_MOBILE_DIAL]
dsn = pbx
readsql = SELECT COALESCE(string_agg('Local/' || ring_delay_s || '-' || id || '@ring-mobile', '&' ORDER BY ring_order, id), '') FROM mobile_legs WHERE extension = '${SQL_ESC(${ARG1})}'

; One mobile leg, checked again when it is dialled: owner's extension, number (E.164)
[MOBILE_LEG]
dsn = pbx
readsql = SELECT extension, mobile_e164 FROM mobile_legs WHERE id = '${SQL_ESC(${ARG1})}'

; Person: active, dnd, ring_timeout_s, language, no_answer_target, forward_immediate
[USER_INFO]
dsn = pbx
readsql = SELECT (enabled AND phone_allowed)::int, dnd::int, ring_timeout_s, language, COALESCE(no_answer_target, 0), COALESCE(forward_immediate, 0) FROM users WHERE extension = '${SQL_ESC(${ARG1})}' AND deleted_at IS NULL

; Extension and permissions of the calling device
[CALLER_INFO]
dsn = pbx
readsql = SELECT u.extension, array_to_string(e.classes, '-'), COALESCE(d.e164, '') FROM active_devices a JOIN users u ON u.id = a.user_id JOIN user_effective_classes e ON e.user_id = u.id LEFT JOIN dids d ON d.id = u.outbound_did_id WHERE a.sip_username = '${SQL_ESC(${ARG1})}'

; Device by 4-digit number
[DEVICE_DIAL]
dsn = pbx
readsql = SELECT 'PJSIP/' || sip_username FROM active_devices WHERE number = '${SQL_ESC(${ARG1})}'

; Best route for a (normalised) number ARG1 and the caller's outbound number ARG2 (E.164 or empty):
; action, strip, prepend, route_class, trunks. route_for() and route_trunk_order() are shared with
; patchbay-web (self-service check, route tester). trunks = the trunks to try in order, separated by
; "|", each "asterisk_ref/kind/max channels/caller ID/trunk of that caller ID" (caller ID E.164 or
; empty, its trunk's asterisk_ref or empty); characters that never occur in an Asterisk trunk name
; (trunks_asterisk_ref_check) or an E.164 number. Empty when no trunk of the rule is switched on.
[ROUTE]
dsn = pbx
readsql = SELECT f.action, f.strip_digits, f.prepend, f.route_class, COALESCE((SELECT string_agg(o.trunk || '/' || o.trunk_kind || '/' || o.max_channels || '/' || o.clip_e164 || '/' || o.clip_trunk, '|' ORDER BY o.attempt) FROM route_trunk_order(f.route_id, '${SQL_ESC(${ARG2})}') o), '') FROM route_for('${SQL_ESC(${ARG1})}') f

; Target of an own number (E.164), depending on its time profile (open / closed / holiday)
[DID_TARGET]
dsn = pbx
readsql = SELECT CASE WHEN ir.time_profile_id IS NULL THEN ir.target_open ELSE CASE time_profile_state(ir.time_profile_id) WHEN 'open' THEN ir.target_open WHEN 'holiday' THEN COALESCE(ir.target_holiday, ir.target_closed, ir.target_open) ELSE COALESCE(ir.target_closed, ir.target_open) END END FROM dids d JOIN inbound_rules ir ON ir.did_id = d.id WHERE d.e164 = '${SQL_ESC(${ARG1})}'

; DID of a trunk if the called number is ambiguous (exactly one DID per trunk)
[TRUNK_DID]
dsn = pbx
readsql = SELECT d.e164 FROM dids d JOIN trunks t ON t.id = d.trunk_id WHERE t.asterisk_ref = '${SQL_ESC(${ARG1})}' ORDER BY d.id LIMIT 1

; Resolve target: kind, user-extension, group-number, ivr_id, sound-path, external, owner extension
; (self-service targets: external numbers are dialled with the owner's classes; empty = admin-configured)
[TARGET]
dsn = pbx
readsql = SELECT t.kind, COALESCE(u.extension::text, ''), COALESCE(g.number::text, ''), COALESCE(t.ivr_id::text, ''), COALESCE(s.file_path, ''), COALESCE(t.external_e164, ''), CASE WHEN t.owner_user_id IS NULL THEN '' ELSE COALESCE(o.extension::text, '0') END, COALESCE(a.number::text, '') FROM targets t LEFT JOIN users u ON u.id = t.user_id LEFT JOIN groups g ON g.id = t.group_id LEFT JOIN sounds s ON s.id = t.sound_id LEFT JOIN users o ON o.id = t.owner_user_id AND o.deleted_at IS NULL LEFT JOIN apps a ON a.id = t.app_id AND a.deleted_at IS NULL WHERE t.id = '${SQL_ESC(${ARG1})}'

; Caller name from the called person's own contacts: ARG1 = called extension, ARG2 = caller number
; (contact_name(); asterisk cannot read the contacts table itself)
[CONTACT_NAME]
dsn = pbx
readsql = SELECT COALESCE(contact_name('${SQL_ESC(${ARG1})}', '${SQL_ESC(${ARG2})}'), '')

; Directed pickup *8<ext>: ARG1 = endpoint of the picking device, ARG2 = colleague's extension.
; The colleague's ringing devices ("PJSIP/a&PJSIP/b") only if their call group is one of the
; picker's pickup groups (both are users.pickup_group, see ps_endpoints), otherwise empty.
; Same rule in patchbay-web companion.rs offers() (pickup offers in the call widget): keep both in sync.
[PICKUP_DIAL]
dsn = pbx
readsql = SELECT COALESCE(string_agg('PJSIP/' || t.sip_username, '&' ORDER BY t.id), '') FROM active_devices t WHERE t.extension = '${SQL_ESC(${ARG2})}' AND t.ring AND EXISTS (SELECT 1 FROM active_devices p WHERE p.sip_username = '${SQL_ESC(${ARG1})}' AND p.user_id <> t.user_id AND string_to_array(p.pickup_group, ',') && string_to_array(t.pickup_group, ','))

; Group: id, strategy, member_timeout_s, total_timeout_s, moh, no_answer_target, caller_name_prefix, queue, language
[GROUP_INFO]
dsn = pbx
readsql = SELECT g.id, g.strategy, g.member_timeout_s, g.total_timeout_s, CASE WHEN NOT g.moh THEN '' WHEN p.id IS NULL OR p.is_default THEN 'default' ELSE 'pl' || p.id END, COALESCE(g.no_answer_target, 0), g.caller_name_prefix, g.queue::int, g.language FROM groups g LEFT JOIN moh_playlists p ON p.id = g.moh_playlist_id AND EXISTS (SELECT 1 FROM moh_media m WHERE m.playlist_id = p.id) WHERE g.number = '${SQL_ESC(${ARG1})}' AND g.deleted_at IS NULL

; Reachable members of a group as "1020-1021-1015" (active, no DND, at least one ringing device)
[GROUP_MEMBERS]
dsn = pbx
readsql = SELECT COALESCE(string_agg(r.extension::text, '-' ORDER BY r.priority, r.extension), '') FROM group_ringing_members r JOIN groups g ON g.id = r.group_id WHERE g.number = '${SQL_ESC(${ARG1})}' AND g.deleted_at IS NULL

; IVR: greeting (sound ID), timeout, repetitions, target on no input
[IVR_INFO]
dsn = pbx
readsql = SELECT COALESCE(i.greeting::text, ''), i.timeout_s, i.repeat, COALESCE(i.timeout_target, 0), i.invalid_mode FROM ivrs i WHERE i.id = '${SQL_ESC(${ARG1})}' AND i.deleted_at IS NULL

; IVR digit → targets.id
[IVR_OPTION]
dsn = pbx
readsql = SELECT target_id FROM ivr_options WHERE ivr_id = '${SQL_ESC(${ARG1})}' AND digit = '${SQL_ESC(${ARG2})}'

; Announcement before a group rings (sound ID or empty)
[GROUP_ANNOUNCE]
dsn = pbx
readsql = SELECT COALESCE(announce_sound_id::text, '') FROM groups WHERE number = '${SQL_ESC(${ARG1})}' AND deleted_at IS NULL

; Effective permission classes of a user by extension (click-to-call), joined with "-"
[USER_CLASSES]
dsn = pbx
readsql = SELECT array_to_string(e.classes, '-'), COALESCE(d.e164, '') FROM users u JOIN user_effective_classes e ON e.user_id = u.id LEFT JOIN dids d ON d.id = u.outbound_did_id WHERE u.extension = '${SQL_ESC(${ARG1})}' AND u.deleted_at IS NULL AND u.enabled AND u.phone_allowed

; IVR by internal number (4 digits, number registry)
[IVR_BY_NUMBER]
dsn = pbx
readsql = SELECT id FROM ivrs WHERE number = '${SQL_ESC(${ARG1})}' AND deleted_at IS NULL

; Assigned keys of an IVR as one string, e.g. "1234*"
[IVR_DIGITS]
dsn = pbx
readsql = SELECT COALESCE(string_agg(digit, '' ORDER BY digit), '') FROM ivr_options WHERE ivr_id = '${SQL_ESC(${ARG1})}'

; Custom app (admin dialplan block) by internal number
[CUSTOM_APP]
dsn = pbx
readsql = SELECT id FROM custom_apps WHERE number = '${SQL_ESC(${ARG1})}' AND enabled AND deleted_at IS NULL

; App "group": ring time, caller name prefix, ringing members ("1020-1024"); patchbay-web: apps.rs
[APP_GROUP]
dsn = pbx
readsql = SELECT ring_s, prefix, members FROM app_group WHERE id = '${SQL_ESC(${ARG1})}'

; Self-service app by number: id, kind, pin, admin_pin, max_members, moh_class, sound_file, repeat, target, name
[APP]
dsn = pbx
readsql = SELECT id, kind, pin, admin_pin, max_members, moh_class, sound_file, repeat, target, name FROM app_dialplan WHERE number = '${SQL_ESC(${ARG1})}'

; Site setting (e.g. sip_realm)
[SETTING]
dsn = pbx
readsql = SELECT value FROM settings WHERE key = '${SQL_ESC(${ARG1})}'

; Permission classes of a trunk (calls arriving via that trunk), joined with "-"
[TRUNK_CLASSES]
dsn = pbx
readsql = SELECT array_to_string(route_classes, '-') FROM trunks WHERE asterisk_ref = '${SQL_ESC(${ARG1})}' AND enabled AND deleted_at IS NULL

; Trunk info: site prefix, max channels
[TRUNK_INFO]
dsn = pbx
; site prefix, channel limit, inbound mode, take over caller name (1/0), caller number (1/0), trunk name
; (no commas: it may become the caller name)
readsql = SELECT COALESCE(site_prefix, ''), COALESCE(max_channels, 0), inbound_mode::text, accept_caller_name::int, accept_caller_number::int, btrim(regexp_replace(name, '[[:cntrl:]",\\]+', ' ', 'g')) FROM trunks WHERE asterisk_ref = '${SQL_ESC(${ARG1})}' AND enabled AND deleted_at IS NULL

; Inbound rule of a trunk for a (normalised) number: action, kinds ("person-group"), target id
[TRUNK_RULE]
dsn = pbx
readsql = SELECT r.action, array_to_string(r.kinds, '-'), COALESCE(r.target_id, 0) FROM trunk_inbound_rules r JOIN trunks t ON t.id = r.trunk_id WHERE t.asterisk_ref = '${SQL_ESC(${ARG1})}' AND t.enabled AND t.deleted_at IS NULL AND '${SQL_ESC(${ARG2})}' LIKE r.match_prefix || '%' AND length('${SQL_ESC(${ARG2})}') >= r.min_len AND (r.max_len IS NULL OR length('${SQL_ESC(${ARG2})}') <= r.max_len) ORDER BY r.priority, length(r.match_prefix) DESC LIMIT 1

; Personal mailbox greeting: ARG1 = user|group, ARG2 = extension / group number -> sound file name
[GREETING]
dsn = pbx
readsql = SELECT s.file_path FROM greetings g JOIN sounds s ON s.id = g.sound_id AND s.deleted_at IS NULL AND s.file_path <> '' WHERE g.kind = 'unavailable' AND g.owner_type = '${SQL_ESC(${ARG1})}' AND g.owner_id = CASE '${SQL_ESC(${ARG1})}' WHEN 'user' THEN (SELECT id FROM users WHERE extension::text = '${SQL_ESC(${ARG2})}' AND deleted_at IS NULL) ELSE (SELECT id FROM groups WHERE number::text = '${SQL_ESC(${ARG2})}' AND deleted_at IS NULL) END

; Kind of an internal number from the number registry (person, device, group, ivr, custom_app, app, company_app)
[NUMBER_KIND]
dsn = pbx
readsql = SELECT kind FROM numbers WHERE number::text = '${SQL_ESC(${ARG1})}'

; Language of a mailbox owner (ARG1 = user|group, ARG2 = extension or group number): prompts in the
; owner's language, not the caller's
[MAILBOX_LANG]
dsn = pbx
readsql = SELECT language FROM users WHERE '${SQL_ESC(${ARG1})}' = 'user' AND extension::text = '${SQL_ESC(${ARG2})}' AND deleted_at IS NULL UNION ALL SELECT language FROM groups WHERE '${SQL_ESC(${ARG1})}' = 'group' AND number::text = '${SQL_ESC(${ARG2})}' AND deleted_at IS NULL LIMIT 1

; Blocklist: '1' when an incoming trunk call must be rejected (counts the hit)
[CALLER_BLOCKED]
dsn = pbx
readsql = SELECT caller_blocked('${SQL_ESC(${ARG1})}')

; Personal blocklist: '1' when the person with extension ARG1 blocked caller number ARG2 (counts the
; hit). Asked in sub-user only, so calls to call groups and queues are not affected.
[USER_CALLER_BLOCKED]
dsn = pbx
readsql = SELECT user_caller_blocked('${SQL_ESC(${ARG1})}', '${SQL_ESC(${ARG2})}')
