; IAX2 network between sites. Peers are generated by patchbay-web from the database.
[general]
bindport = 4569
bindaddr = 0.0.0.0
disallow = all
allow = g722
allow = alaw
jitterbuffer = no
requirecalltoken = yes
delayreject = yes
autokill = yes
; no anonymous/guest access
allowguest = no
transfer = no
iaxcompat = no
; key rotation causes "Packet Decrypt Failed" between some versions
keyrotate = off

#tryinclude /etc/asterisk-generated/iax_peers.conf
