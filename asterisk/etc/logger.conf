[general]
dateformat = %F %T.%3q
; patchbay-web runs "logger rotate" daily (housekeeping.rs): the current file becomes .0, older ones
; move up, the 8th generation is deleted. The verbose call trace only goes to the console
; (docker logs, size-limited in compose.yml).
rotatestrategy = rotate
; app_queue statistics file: not used (call records and call tracking cover it)
queue_log = no
; ${filename} is the new .0 file: strip ".0" to name the 8th generation
exec_after_rotate = rm -f ${filename:0:-2}.7

[logfiles]
console => notice,warning,error,verbose
messages.log => notice,warning,error
security.log => security

; own additions of the site ($PBX_DIR/config/asterisk/logger.d/*.conf, docs/configuration.md "Own Asterisk configuration");
; each file starts with its own [section] (modules.d: load/noload lines may follow directly)
#tryinclude /etc/asterisk-custom/logger.d/*.conf
