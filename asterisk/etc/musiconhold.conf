; Default music on hold: the company hold music playlist from the web UI (Admin → Audio), synced by
; patchbay-web to /media/moh/default ($PBX_DIR/media/moh/default on the host; "moh reload" after
; changes). App and playlist classes come via realtime (musiconhold view).
[general]
cachertclasses = no

[default]
mode = files
directory = /var/lib/asterisk/moh-apps/default
sort = random

; own additions of the site ($PBX_DIR/config/asterisk/musiconhold.d/*.conf, docs/configuration.md "Own Asterisk configuration");
; each file starts with its own [section] (modules.d: load/noload lines may follow directly)
#tryinclude /etc/asterisk-custom/musiconhold.d/*.conf
