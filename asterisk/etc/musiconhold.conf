; Default music on hold: the company hold music playlist from the web UI (Admin → Audio), synced by
; patchbay-web to /media/moh/default ($PBX_DIR/media/moh/default on the host; "moh reload" after
; changes). App and playlist classes come via realtime (musiconhold view).
[general]
cachertclasses = no

[default]
mode = files
directory = /var/lib/asterisk/moh-apps/default
sort = random
