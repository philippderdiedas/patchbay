; Static part: global, system, transports (rendered at start).
; Devices come from PostgreSQL via realtime (sorcery.conf), SIP trunks from patchbay-web (generated file).

[global]
type = global
user_agent = PBX
endpoint_identifier_order = ip,username
max_initial_qualify_time = 10

[system]
type = system
timer_t1 = 500
timer_b = 32000

; --- Transports: rendered from the environment at container start (asterisk/bin/site-config.sh) ---
#include /etc/asterisk-site/pjsip-transports.conf

; --- SIP trunks managed in the web UI (patchbay-web) --------------------------------------
#tryinclude /etc/asterisk-generated/pjsip_trunks.conf

; own additions of the site ($PBX_DIR/config/asterisk/pjsip.d/*.conf, docs/configuration.md "Own Asterisk configuration");
; each file starts with its own [section] (modules.d: load/noload lines may follow directly)
#tryinclude /etc/asterisk-custom/pjsip.d/*.conf
