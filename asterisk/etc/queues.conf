; Call groups in queue mode are realtime queues (extconfig.conf: queues, queue_members; views
; queue_rt and queue_members_rt from the schema), named g<group id>. Nothing is configured here.
[general]
persistentmembers = no
autofill = yes
shared_lastcall = yes
log_membername_as_agent = yes

; own additions of the site ($PBX_DIR/config/asterisk/queues.d/*.conf, docs/configuration.md "Own Asterisk configuration");
; each file starts with its own [section] (modules.d: load/noload lines may follow directly)
#tryinclude /etc/asterisk-custom/queues.d/*.conf
