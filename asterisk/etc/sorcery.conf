; Trunks and transports from pjsip.conf, devices from the PostgreSQL views.
; Contacts stay in the astdb.
; Devices are cached in memory so registrations and emergency calls keep working when PostgreSQL is
; unreachable: after 60 s an object is refreshed in the background, a failed refresh keeps the old one
; (up to 24 h). patchbay-web expires single devices via AMI on changes (lock, delete, rename).
; expire_on_reload = no: a pjsip.conf reload (trunk change in the web UI) keeps the cached devices;
; patchbay-web expires the whole caches at its start (after migrations, which recreate its container).
; Order cache, realtime, config: a "retrieve all" (pjsip show endpoints, and the qualify/device state
; setup at load) stops at a cache wizard once the container holds objects, so with config first it
; saw only the trunks, never the devices: their endpoint state stayed Unavailable (hints, queues).
[res_pjsip]
endpoint/cache = memory_cache,name=pbx_endpoint,object_lifetime_stale=60,object_lifetime_maximum=86400,expire_on_reload=no
endpoint = realtime,ps_endpoints
endpoint = config,pjsip.conf,criteria=type=endpoint
auth/cache = memory_cache,name=pbx_auth,object_lifetime_stale=60,object_lifetime_maximum=86400,expire_on_reload=no
auth = realtime,ps_auths
auth = config,pjsip.conf,criteria=type=auth
aor/cache = memory_cache,name=pbx_aor,object_lifetime_stale=60,object_lifetime_maximum=86400,expire_on_reload=no
aor = realtime,ps_aors
aor = config,pjsip.conf,criteria=type=aor

[res_pjsip_endpoint_identifier_ip]
identify = config,pjsip.conf,criteria=type=identify
