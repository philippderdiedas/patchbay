; TEST ONLY - never mount on a production system. These contexts skip permission checks.
; Enable on a test host: add to the asterisk service in deploy/compose.yml
;   - ../asterisk/test:/etc/asterisk-test:ro
; and run `dialplan reload`.

; --- Test: outbound without own device (originate from the CLI) ------------------
[test-call]
exten => _X.,1,Set(PBX_ALLOW_EXTERNAL=${EXTEN})
 same => n,Gosub(sub-outbound,s,1(${EXTEN}))
 same => n,Hangup()

; --- Test: caller ID (CLIP) via P-Asserted-Identity ---------------------------------
; channel originate Local/<target>@test-clip application Wait 1
; with the globals CLIPTEST (number to send), TESTTRUNK (Asterisk name of the SIP trunk, e.g. sip-3)
; and TESTDOMAIN (host part of the P-Asserted-Identity, usually the provider's SIP domain) set
[test-clip]
exten => _X.,1,Set(CALLERID(num)=${CLIPTEST})
 same => n,Dial(PJSIP/${EXTEN}@${TESTTRUNK},25,b(test-clip-hdr^s^1))
 same => n,Hangup()

[test-clip-hdr]
exten => s,1,Set(PJSIP_HEADER(add,P-Asserted-Identity)=<sip:${CLIPTEST}@${TESTDOMAIN}>)
 same => n,Return()

; --- Test: permission check (FIELDNUM) -----------------------------------------------
[test-classes]
exten => _[a-z].,1,Set(C=internal-national-mobile)
 same => n,NoOp(class=${EXTEN} pos=${FIELDNUM(C,-,${EXTEN})})
 same => n,Hangup()

; --- Test: start IVR directly (channel originate Local/<ivr-id>@test-ivr …) ----------
[test-ivr]
exten => _X!,1,Gosub(sub-ivr,s,1(${EXTEN}))
 same => n,Hangup()

; --- Test: voicemail (channel originate Local/<ext>@test-vm application Playback demo-congrats) ---
[test-vm]
exten => _[1-9]XXX,1,Gosub(sub-mailbox,s,1(user,${EXTEN}))
 same => n,Hangup()

; --- Custom apps (generated by patchbay-web from admin templates) ------------------------------

; --- Test: outbound with the rights of a user, without ringing their devices --------------
; channel originate Local/<number>@test-as-user application Wait 5   (sets PBX_C2C_EXT=1020)
[test-as-user]
exten => _X.,1,Set(PBX_C2C_EXT=1020)
 same => n,Gosub(sub-outbound,s,1(${EXTEN}))
 same => n,Hangup()
