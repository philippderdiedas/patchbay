{% extends "base.html" %}
{% block title %}{{ c.t.s("Log in") }}{% endblock %}
{% block content %}
<div class="card" style="max-width:460px;margin:40px auto">
  <img class="login-logo" src="/static/logo" alt="" width="96" height="96">
  <h2>{{ c.t.s("Log in") }}</h2>
  {% if let Some(e) = error %}<p class="off" role="alert">{{ c.t.s(e) }}</p>{% endif %}
  {% if local %}
  <form method="post" action="/auth/login">
    <table class="form">
      <tr><th><label for="login">{{ c.t.s("Login name") }}</label></th>
        <td><input id="login" name="login" value="{{ login }}" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="64" required {% if login.is_empty() %}autofocus{% endif %}></td></tr>
      <tr><th><label for="password">{{ c.t.s("Password") }}</label></th>
        <td><input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required {% if !login.is_empty() %}autofocus{% endif %}></td></tr>
    </table>
    <p class="row"><button class="primary">{{ c.t.s("Log in") }}</button></p>
  </form>
  {% endif %}
  {% if oidc %}
  <form method="get" action="/auth/oidc" class="row">
    {% if local %}<span class="muted">{{ c.t.s("or") }}</span>{% endif %}
    <button {% if !local %}class="primary"{% endif %}>{{ c.t.s("Log in with single sign-on") }}</button>
  </form>
  {% endif %}
</div>
{% endblock %}
